  #   recovery_regex: "port-security.*recover|SECURITY-6-RECOVER"
  #   recovery_name: "端口安全恢复"

  # ====== 示例2：自定义VPN隧道告警 ======
  # - name: "自定义-VPN隧道断开"
  #   level: critical
  #   regex: "IPSEC-3-VPN_DOWN|IKE.*sa.*down|tunnel.*down|VPN.*disconnect"
  #   description: "VPN/IPSec隧道断开，远程站点连接中断"
  #   affected_components:
  #     - "VPN隧道"
