# ==========================================
# 自定义告警规则 - custom.yaml
# ==========================================
# 此文件中的规则会自动加载并应用到 ALL 设备（无论锐捷还是华为）
#
# 添加规则步骤：
#   1. 在下方 patterns 列表中添加你的规则
#   2. 保存文件，容器会自动重新加载（需要重启容器）
#   3. 查看容器日志确认规则已加载：
#      docker logs switch-monitor 2>&1 | grep "custom"
#
# 规则格式说明：
#   name:              告警名称（必填，用于通知标题和去重）
#   level:             告警级别（必填）：critical / warning / info
#   regex:             匹配正则（必填，不区分大小写）
#   description:       告警描述（必填）
#   affected_components: 受影响组件列表（选填）
#   quick_check:       排查命令（选填）
#   recovery_regex:    恢复匹配正则（选填，匹配恢复日志）
#   recovery_name:     恢复通知标题（选填，配置了 recovery_regex 时建议填写）
#
# ⚠️ 注意事项：
#   - regex 不区分大小写（已内置 re.IGNORECASE）
#   - 多个匹配条件用 | 分隔（正则"或"语义）
#   - 特殊字符需要转义：. → \.  * → \*  ( → \(  ) → \)
#   - name 必须全局唯一，不能和 ruijie.yaml / huawei.yaml 中的重名
#   - 建议在 name 中加上前缀区分，如 "自定义-xxx"

patterns:

