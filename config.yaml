# 网络设备智能巡检告警系统 - 主配置文件
# 请根据实际环境修改以下配置
#
# 部署架构：
#   syslog 服务器: 192.168.40.198 (rsyslog 按设备分目录存储日志)
#   Docker 服务器: 192.168.40.17  (运行监控容器)
#   日志通过 NFS 从 192.168.40.198 挂载到容器内

# ==================== Syslog 配置 ====================
syslog:
  # rsyslog 按设备分目录的根路径（容器内路径）
  # 宿主机通过 NFS 挂载 192.168.40.198:/log/syslog → /mnt/syslog
  # Docker 再映射 /mnt/syslog → 容器内 /var/log/switches
  # 目录名是 IP 地址（如 10.250.50.80/），通过 match_ips 识别厂商
  base_dir: "/var/log/switches"

  # 监控的设备目录名前缀（用于识别设备）
  # 会自动扫描 base_dir 下的所有子目录
  device_dir_pattern: "*"

  # 日志文件名格式：{IP}_YYYY-MM-DD.log（如 192.168.30.111_2026-04-15.log）
  # 系统只监控当天的日志文件，自动按日期构造文件名
  # 目录结构：{base_dir}/{IP}/{IP}_YYYY-MM-DD.log

  # 轮询间隔（秒），检查新日志的频率
  poll_interval: 5

  # 每次读取的最大行数（防止日志暴增时内存溢出）
  max_lines_per_read: 500

# ==================== 设备识别 ====================
# 支持两种识别方式（优先级：IP精确匹配 > 关键字模糊匹配）：
#   1. match_ips：目录名是 IP 地址时，直接按 IP 精确匹配（推荐）
#   2. match_keywords：目录名含关键字时模糊匹配（目录名非 IP 时使用）
# monitor 会自动加载 patterns/ 下对应的 YAML 匹配规则
#
# ⚠️ 各设备日志级别差异：
#         交换机：仅发送 level 4 (warning) 及以上日志
#         无线AC：仅发送 level 4 (warning) 及以上日志
#         防火墙/VPN：发送所有级别日志，规则已做级别过滤
#         SmartX HCI：发送所有级别日志，规则已做级别过滤
devices:
  # ========== 锐捷设备（交换机 + 无线AC） ==========
  - vendor: ruijie
    # 匹配规则：目录名包含以下关键字时识别为锐捷设备
    match_keywords: ["ruijie", "rj", "RG-", "S5"]
    # ⬇️ 目录名是 IP 时，在此列出锐捷设备的 IP 地址
    # 总计：1台无线AC + 47台交换机 = 48台
    match_ips:
      # ===== 无线AC =====
      - "10.250.50.20"       # 锐捷无线AC WS6816 (AC_RGOS 11.9(2)B2P11)
      # ===== VSU堆叠 - 楼层汇聚交换机（6组堆叠） =====
      - "10.250.50.50"       # 楼层汇聚交换机 VSU堆叠组1
      - "10.250.50.60"       # 楼层汇聚交换机 VSU堆叠组2
      - "10.250.50.70"       # 楼层汇聚交换机 VSU堆叠组3
      - "10.250.50.80"       # 楼层汇聚交换机 VSU堆叠组4
      - "10.250.50.90"       # 楼层汇聚交换机 VSU堆叠组5
      - "10.250.50.100"      # 楼层汇聚交换机 VSU堆叠组6
      # ===== VSU堆叠 - 服务器交换机（3台堆叠） =====
      - "10.250.50.151"      # 服务器交换机 VSU堆叠
      - "10.250.50.153"      # 服务器交换机 VSU堆叠
      - "10.250.50.155"      # 服务器交换机 VSU堆叠
      # ===== 单台接入交换机（38台） =====
      - "10.250.50.51"       # 接入交换机
      - "10.250.50.52"       # 接入交换机
      - "10.250.50.53"       # 接入交换机
      - "10.250.50.54"       # 接入交换机
      - "10.250.50.55"       # 接入交换机
      - "10.250.50.56"       # 接入交换机
      - "10.250.50.57"       # 接入交换机
      - "10.250.50.61"       # 接入交换机
      - "10.250.50.62"       # 接入交换机
      - "10.250.50.63"       # 接入交换机
      - "10.250.50.64"       # 接入交换机
      - "10.250.50.65"       # 接入交换机
      - "10.250.50.66"       # 接入交换机
      - "10.250.50.67"       # 接入交换机
      - "10.250.50.71"       # 接入交换机
      - "10.250.50.72"       # 接入交换机
      - "10.250.50.73"       # 接入交换机
      - "10.250.50.74"       # 接入交换机
      - "10.250.50.76"       # 接入交换机
      - "10.250.50.77"       # 接入交换机
      - "10.250.50.78"       # 接入交换机
      - "10.250.50.81"       # 接入交换机
      - "10.250.50.82"       # 接入交换机
      - "10.250.50.84"       # 接入交换机
      - "10.250.50.85"       # 接入交换机
      - "10.250.50.86"       # 接入交换机
      - "10.250.50.91"       # 接入交换机
      - "10.250.50.92"       # 接入交换机
      - "10.250.50.93"       # 接入交换机
      - "10.250.50.94"       # 接入交换机
      - "10.250.50.95"       # 接入交换机
      - "10.250.50.96"       # 接入交换机
      - "10.250.50.101"      # 接入交换机
      - "10.250.50.102"      # 接入交换机
      - "10.250.50.103"      # 接入交换机
      - "10.250.50.104"      # 接入交换机
      - "10.250.50.105"      # 接入交换机
      - "10.250.50.106"      # 接入交换机
    pattern_file: "ruijie.yaml"

  # ========== 华为交换机 ==========
  - vendor: huawei
    match_keywords: ["huawei", "hw", "CE", "S9", "S7", "S5700", "S67"]
    # ⬇️ 目录名是 IP 时，在此列出华为交换机的 IP 地址
    # 总计：2台堆叠交换机
    match_ips:
      - "10.250.50.152"      # 华为堆叠交换机
      - "10.250.50.154"      # 华为堆叠交换机
    pattern_file: "huawei.yaml"

  # ========== 深信服设备（防火墙 AF + SSL VPN） ==========
  - vendor: sangfor
    # 匹配规则：目录名包含以下关键字时识别为深信服设备
    # AF 防火墙目录名通常含: sangfor, AF, af, fw, 防火墙
    # SSL VPN 目录名通常含: sangfor, SSL, vpn, vpn-
    match_keywords: ["sangfor", "AF", "af-", "ssl-vpn", "vpn-", "SSLVPN", "sxf"]
    # ⬇️ 目录名是 IP 时，在此列出深信服设备的 IP 地址
    match_ips:
      - "10.250.55.21"     # AF 防火墙节点1
      - "10.250.55.22"     # AF 防火墙节点2（集群部署）
      - "10.250.50.42"     # SSL VPN 节点1
      - "192.168.50.43"    # SSL VPN 节点2
      - "192.168.50.41"    # SSL VPN 集群虚拟IP
    pattern_file: "sangfor.yaml"

  # ========== SmartX 超融合平台 ==========
  - vendor: smartx
    # SmartX SMTX OS 6.2.0 超融合节点 + CloudTower 管理平台
    # 基于Linux，syslog包含内核日志、ZBS存储日志、ELF虚拟化日志
    match_keywords: ["smartx", "smtx", "SMTX", "cloudtower", "zbs"]
    # ⬇️ 目录名是 IP 时，在此列出 SmartX 设备的 IP 地址
    match_ips:
      - "192.168.30.111"   # SmartX HCI 节点1 (SMTX OS 6.2.0)
      - "192.168.30.112"   # SmartX HCI 节点2 (SMTX OS 6.2.0)
      - "192.168.30.113"   # SmartX HCI 节点3 (SMTX OS 6.2.0)
      - "192.168.30.200"   # SmartX CloudTower 管理平台
    pattern_file: "smartx.yaml"

# ==================== 钉钉通知配置 ====================
dingtalk:
  # 钉钉机器人 Webhook URL
  # 获取方式: 钉钉群 -> 设置 -> 智能群助手 -> 添加机器人 -> 自定义
  webhook_url: "https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN_HERE"

  # 安全设置中的关键词（钉钉机器人要求消息中必须包含此关键词）
  # ⚠️ 当前监控设备包括：交换机、无线AC、防火墙、SSL VPN、超融合
  #     建议改为"网络告警"或"告警"等通用关键词
  #     或确保钉钉机器人关键词设置包含"告警"即可匹配所有通知
  keyword: "交换机告警"

  # 加签密钥（如果机器人开启了加签验证，请填写；否则留空）
  secret: ""

  # @ 指定人的手机号（留空则不 @ 任何人）
  at_mobiles: []

  # 是否 @ 所有人
  at_all: false

  # 告警去重窗口（秒）：同一设备同一类告警在此窗口内不重复通知
  # 窗口过后如果日志中仍在产生同类告警，会重新发送钉钉通知
  # 默认 3600（1小时），可在 alert_levels 中按级别覆盖
  notify_window: 3600

# ==================== AI 分析配置 ====================
ai:
  # 是否启用 AI 分析（false 时仅发送原始告警，不调用 AI）
  enabled: true

  # OpenAI 兼容 API 配置（支持 DeepSeek、通义千问、智谱等国内大模型）
  api_base: "https://api.deepseek.com/v1"
  api_key: "YOUR_API_KEY_HERE"
  model: "deepseek-chat"

  # AI 分析超时（秒）
  timeout: 30

  # AI 分析的系统提示词
  system_prompt: |
    你是一位资深的IT基础设施运维专家，擅长以下设备的故障诊断：
    - 锐捷/华为交换机、锐捷无线AC(WS6816)
    - 深信服防火墙(AF)和SSL VPN
    - SmartX超融合平台(SMTX OS 6.2.0)和CloudTower

    根据提供的设备告警日志，你需要：
    1. 分析告警的根本原因（根因分析）
    2. 给出具体的处理步骤（操作指南）
    3. 评估影响范围和紧急程度
    4. 如需进一步排查，给出排查方法或命令

    针对不同设备类型：
    - 交换机：使用 show/display 命令排查
    - 无线AC：使用 show ap / show capwap 命令排查
    - 防火墙(AF)：参考 AF 控制台日志和系统状态
    - SSL VPN：参考 VPN 控制台在线用户和隧道状态
    - SmartX超融合：使用 zbs-node / smartctl / mdadm 命令排查，或参考 CloudTower 界面
    - SmartX CloudTower：检查管理服务状态和集群连通性

    回复要求：
    - 简洁专业，不超过 300 字
    - 使用 Markdown 格式
    - 必须包含：根因、处理步骤、紧急程度（红/橙/黄）

# ==================== 告警级别配置 ====================
alert_levels:
  critical:
    # 紧急告警：立即通知
    color: "🔴"
    dingtalk: true
    ai_analysis: true
    notify_window: 1800  # 同一设备同一告警30分钟内不重复通知

  warning:
    # 警告：通知并分析
    color: "🟠"
    dingtalk: true
    ai_analysis: true
    notify_window: 3600  # 同一设备同一告警1小时内不重复通知

  info:
    # 关注：记录，可选择通知
    color: "🟡"
    dingtalk: false
    ai_analysis: false
    notify_window: 7200  # 同一设备同一告警2小时内不重复通知

# ==================== 运行时状态 ====================
runtime:
  # 记录已读文件位置的文件（防止重复处理）
  # Docker 部署时映射到持久卷 /app/state/
  state_file: "/app/state/switch-monitor-state.json"

  # 运行日志（Docker 部署时映射到持久卷 /app/logs/）
  log_file: "/app/logs/switch-monitor.log"

  # 日志级别: DEBUG, INFO, WARNING, ERROR
  log_level: "INFO"
